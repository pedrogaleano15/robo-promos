name: Caçador de promoções

on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # 4x por hora, fora do minuto 0 (o GitHub descarta muitos agendamentos no minuto 0)
  workflow_dispatch:         # botão "Run workflow" para rodar na hora

permissions:
  contents: write            # para salvar o estado.json no repositório

concurrency:
  group: promos
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Procurar promoções
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python monitor_web.py

      - name: Salvar último post visto
        run: |
          git config user.name "robo-promos"
          git config user.email "robo-promos@users.noreply.github.com"
          git add estado.json
          git diff --staged --quiet || (git commit -m "estado: $(date -u +%FT%TZ)" && git push)
